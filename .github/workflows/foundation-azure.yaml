name: plan and apply workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: environment to plan and apply terraform on
      tf-version:
        required: false
        default: 1.9.1
        type: string
      azure-subscription-id:
        required: true
        type: string
        description: Azure Subscription ID
      azure-client-id:
        required: true
        type: string
        description: Azure Client ID
      azure-tenant-id:
        required: true
        type: string
        description: Azure Tenant ID

env:
  # TF_LOG: INFO # Uncomment for debugging
  TF_ENV: ${{ inputs.environment }}
  ARM_CLIENT_ID: ${{ inputs.azure-client-id }}
  ARM_TENANT_ID: ${{ inputs.azure-tenant-id}}
  ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id}}
  # GitHub App credentials for Terraform github provider;
  # We could set these without TF_VAR_ prefix and save some variable entry in Terraform,
  # but we want other steps to use the default deployment token, not the app token.
  TF_VAR_github_app_id: ${{ secrets.INF_FOUNDATION_APP_ID }}
  TF_VAR_github_app_key: ${{ secrets.INF_FOUNDATION_APP_KEY }}
  TF_VAR_github_app_installation_id: ${{ secrets.INF_FOUNDATION_APP_INSTALLATION_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      tfplanOutput: ${{ steps.tf-plan.outputs.exitcode }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf-version }}
          terraform_wrapper: false

      - name: Initialize Terraform
        id: init
        run: terraform init -backend-config="key=$TF_ENV.tfstate"

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

        # An exit code of 0 indicated no changes, 1 a terraform failure, 2 there are pending changes.
      - name: Terraform plan
        id: tf-plan
        run: |
          export exitcode=0
          terraform plan -var-file=$TF_ENV.tfvars -detailed-exitcode -no-color -out tfplan || export exitcode=$?

          if [ $exitcode -eq 1 ]; then
            # If the exit code was 1 (an actual error), exit the script with a status of '1', indicating failure.
            echo "Terraform plan failed with errors"
            exit 1
          elif [ $exitcode -eq 2 ]; then
            # If the exit code was 2 (changes to apply), continue but return a '0' status from this script.
            echo "Terraform plan has changes to apply"
            echo "exitcode=2" >> $GITHUB_OUTPUT # Set the output variable to reflect the changes
          else
            # If the exit code was 0 (no changes), just set the output variable.
            echo "Terraform plan shows no changes"
            echo "exitcode=0" >> $GITHUB_OUTPUT
          fi
          exit 0 # Ensure the script exits successfully

      - name: Publish Plan
        uses: actions/upload-artifact@v5
        with:
          name: tfplan-${{ inputs.environment }}
          path: tfplan

      # Render the plan to markdown files rather than a step output. A large plan passed
      # through an env var exceeds the kernel's 128 KiB per-argument limit and the next
      # step fails with "Argument list too long". Two sizes are written because the step
      # summary allows 1 MiB but a PR comment only 65536 characters.
      - name: Create String Output
        id: tf-plan-string
        run: |
          terraform show -no-color tfplan > plan.txt

          render() {
            local max=$1
            echo "## Terraform Plan Output: ${TF_ENV}"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo '```terraform'
            if [ "$(wc -c < plan.txt)" -gt "$max" ]; then
              head -c "$max" plan.txt
              echo ""
              echo "... plan truncated, see the workflow run summary or logs for the full output ..."
              grep -E '^(Plan:|No changes\.)' plan.txt || true
            else
              cat plan.txt
            fi
            echo '```'
            echo "</details>"
          }

          render 900000 > plan_summary.md
          render 60000 > plan_comment.md

        # Publish Terraform Plan as task summary
      - name: Publish Terraform Plan to Task Summary
        run: cat plan_summary.md >> $GITHUB_STEP_SUMMARY

      # Callers trigger on push, not pull_request, so context.issue is empty here. Look
      # up the open PR for the pushed branch instead. One comment per environment,
      # found by a hidden marker, is deleted and re-posted so the latest plan is at the
      # bottom of the conversation and stale plans don't pile up. A failure here (missing
      # pull-requests: write, API hiccup) must not block the apply, hence continue-on-error.
      - name: Push Terraform Output to PR
        if: github.ref != 'refs/heads/main' && github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          COMMENT_FILE: plan_comment.md
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const marker = `<!-- terraform-plan:${process.env.TF_ENV} -->`;

            let prs = [];
            if (context.eventName === 'pull_request') {
              prs = [context.issue.number];
            } else {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              const { data } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
              prs = data.map(pr => pr.number);
            }
            if (prs.length === 0) {
              core.info(`No open pull request for ${context.ref}; the plan is in the run summary only.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${fs.readFileSync(process.env.COMMENT_FILE, 'utf8')}\n[Workflow run](${runUrl}) for ${context.sha.slice(0, 7)}`;

            for (const issue_number of prs) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              for (const c of comments.filter(c => c.user?.type === 'Bot' && c.body?.includes(marker))) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
              }
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Posted the ${process.env.TF_ENV} plan to #${issue_number}.`);
            }

  terraform-apply:
    name: Terraform Apply
    # Run if merging into main, OR pull request
    if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && needs.terraform-plan.outputs.tfplanOutput == 2
    needs: [terraform-plan]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf-version }}
          terraform_wrapper: false

      - name: Terraform init
        id: init
        run: terraform init -backend-config="key=$TF_ENV.tfstate"

      - name: Download Plan File
        uses: actions/download-artifact@v6
        with:
          name: tfplan-${{ inputs.environment }}

      - name: Terraform Apply
        id: tf-apply
        run: |
          terraform apply -auto-approve -input=false tfplan | tee apply.log

          if grep "Apply complete!" apply.log; then
            echo "summary=$(grep --color=never -r "Apply complete!" apply.log)" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "summary=Apply Failed see pipeline logs" >> $GITHUB_OUTPUT
            exit 1
          fi

        # Publish Terraform Apply as task summary
      - name: Publish Terraform Apply to Task Summary
        env:
          SUMMARY: ${{ steps.tf-apply.outputs.summary }}
        run: |
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      # If this is a PR post the changes
      - name: Push Terraform Output to PR
        if: github.ref != 'refs/heads/main' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          # github-token: ${{ inputs.GITHUB_TOKEN }} # I'm not sure this is actually doing what we expect - testing.
          script: |
            const body = `Terraform Applied`;
            github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
            })
